name: GHCR registry retention

on:
  workflow_dispatch:
    inputs:
      apply_registry:
        description: Delete eligible unprotected GHCR versions during this manual dispatch
        type: boolean
        required: false
        default: false
      capacity_recovery_ci_run_id:
        description: Exact main CI run with a capacity failure, or a lock timeout owned by this reservation paired with an earlier capacity failure
        type: string
        required: false
        default: ""
      capacity_recovery_ci_attempt:
        description: Exact attempt of that capacity-blocked CI run; supply together with its run ID
        type: string
        required: false
        default: ""
      prior_capacity_ci_run_id:
        description: Earlier exact-main capacity failure; only pair with a current CI run blocked by this exact reservation lock
        type: string
        required: false
        default: ""
      prior_capacity_ci_attempt:
        description: Exact attempt of the earlier capacity failure; supply together with its run ID
        type: string
        required: false
        default: ""
      registry_reservation_run_id:
        description: Exact failed registry-retention run that owns the pending deletion reservation
        type: string
        required: false
        default: ""
      registry_reservation_attempt:
        description: Exact attempt of the failed registry-retention run; supply together with its run ID
        type: string
        required: false
        default: ""
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: read

# Keep every release consumer, publisher and registry cleanup in one repository
# coordination group. LocalSingleNode reads its markers under the shared host lock.
concurrency:
  group: template-registry-payloads
  queue: max
  cancel-in-progress: false

jobs:
  localsinglenode_primary:
    runs-on: [self-hosted, linux, x64, "${{ vars.LOCALSINGLENODE_RUNNER_LABEL || 'localsinglenode-books' }}"]
    timeout-minutes: 15
    environment:
      name: ${{ vars.LOCALSINGLENODE_ENVIRONMENT || 'localsinglenode' }}
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      protection_gzip_b64: ${{ steps.protect.outputs.protection_gzip_b64 }}
    steps:
      - name: Require main branch and enabled LocalSingleNode target
        env:
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
          REGISTRY_RETENTION_APPLY: ${{ inputs.apply_registry == true }}
          RESERVATION_RUN_ID: ${{ inputs.registry_reservation_run_id }}
          RESERVATION_ATTEMPT: ${{ inputs.registry_reservation_attempt }}
          CAPACITY_RECOVERY_CI_RUN_ID: ${{ inputs.capacity_recovery_ci_run_id }}
          CAPACITY_RECOVERY_CI_ATTEMPT: ${{ inputs.capacity_recovery_ci_attempt }}
          PRIOR_CAPACITY_CI_RUN_ID: ${{ inputs.prior_capacity_ci_run_id }}
          PRIOR_CAPACITY_CI_ATTEMPT: ${{ inputs.prior_capacity_ci_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          targets=",${DEPLOY_TARGETS// /},"
          [[ "$targets" == *,localsinglenode,* ]]
          if [[ -n "$RESERVATION_RUN_ID" || -n "$RESERVATION_ATTEMPT" ]]; then
            [[ "$RESERVATION_RUN_ID" =~ ^[1-9][0-9]*$ && "$RESERVATION_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$REGISTRY_RETENTION_APPLY" == true ]]
            [[ "$CAPACITY_RECOVERY_CI_RUN_ID" =~ ^[1-9][0-9]*$ && "$CAPACITY_RECOVERY_CI_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          fi
          if [[ -n "$PRIOR_CAPACITY_CI_RUN_ID" || -n "$PRIOR_CAPACITY_CI_ATTEMPT" ]]; then
            [[ "$PRIOR_CAPACITY_CI_RUN_ID" =~ ^[1-9][0-9]*$ && "$PRIOR_CAPACITY_CI_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ -n "$RESERVATION_RUN_ID" && -n "$RESERVATION_ATTEMPT" && "$REGISTRY_RETENTION_APPLY" == true ]]
            [[ "$CAPACITY_RECOVERY_CI_RUN_ID" =~ ^[1-9][0-9]*$ && "$CAPACITY_RECOVERY_CI_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          fi

      - name: Verify the intended native LocalSingleNode host
        env:
          LOCALSINGLENODE_HOST: ${{ vars.LOCALSINGLENODE_HOST }}
        run: |
          test -n "$LOCALSINGLENODE_HOST"
          test "$(hostname)" = "$LOCALSINGLENODE_HOST"
          test "$(uname -s)" = Linux
          case "$(uname -r)" in *[Mm]icrosoft*) exit 1 ;; esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve the primary app
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          FRONTEND_PROFILE="$(python3 Scripts/Frontend/resolve_frontend_profile.py)"
          ACCEPTANCE_PROFILE="$(python3 Scripts/Frontend/resolve_frontend_profile.py --acceptance-profile)"
          export FRONTEND_PROFILE ACCEPTANCE_PROFILE
          python3 Deployment/LocalSingleNode/Scripts/resolve-deployment.py

      - name: Read primary current and recovery releases under the shared lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCALSINGLENODE_HOST: ${{ vars.LOCALSINGLENODE_HOST }}
          LOCALCLUSTER_DEPLOY_LOCK_TIMEOUT_SECONDS: "300"
          RESERVATION_RUN_ID: ${{ inputs.registry_reservation_run_id }}
          RESERVATION_ATTEMPT: ${{ inputs.registry_reservation_attempt }}
        run: |
          set -euo pipefail
          lock_dir="${LOCALCLUSTER_DEPLOY_LOCK_DIR:-/tmp/localcluster-deploy.lockdir}"
          if [[ -n "$RESERVATION_RUN_ID" && -d "$lock_dir" ]]; then
            lock_token="$(python3 Deployment/Common/Scripts/registry-retention-recovery.py prepare \
              --owner-run-id "$RESERVATION_RUN_ID" --owner-attempt "$RESERVATION_ATTEMPT" \
              --print-lock-token)"
            export LOCALCLUSTER_DEPLOY_LOCK_DIR="$lock_dir" LOCALCLUSTER_DEPLOY_LOCK_TOKEN="$lock_token"
            status="$(python3 Deployment/LocalSingleNode/Scripts/release-status.py | tail -n 1)"
          else
            status="$(bash Deployment/Common/Scripts/with-deploy-lock.sh \
              python3 Deployment/LocalSingleNode/Scripts/release-status.py | tail -n 1)"
          fi
          printf '%s\n' "$status" > "$RUNNER_TEMP/primary-release-status.json"

      - name: Export verified primary registry protections
        id: protect
        run: |
          python3 Deployment/Common/Scripts/registry-protection.py \
            --target localsinglenode \
            --status-json "$RUNNER_TEMP/primary-release-status.json" --github-output >> "$GITHUB_OUTPUT"

      - name: Remove temporary primary configuration
        if: always()
        run: rm -f -- "${DEPLOYMENT_VARS_FILE:-}" "$RUNNER_TEMP/deployment-vars.json"

  prune_registry:
    needs: [localsinglenode_primary]
    if: always() && needs.localsinglenode_primary.result == 'success'
    runs-on: [self-hosted, linux, x64, "${{ vars.LOCALSINGLENODE_RUNNER_LABEL || 'localsinglenode-books' }}"]
    timeout-minutes: 120
    environment:
      name: ${{ vars.LOCALSINGLENODE_ENVIRONMENT || 'localsinglenode' }}
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Require main branch and enabled deployment targets
        env:
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          targets=",${DEPLOY_TARGETS// /},"
          [[ "$targets" == *,localsinglenode,* ]]

      - name: Verify the intended native LocalSingleNode host
        env:
          LOCALSINGLENODE_HOST: ${{ vars.LOCALSINGLENODE_HOST }}
        run: |
          test -n "$LOCALSINGLENODE_HOST"
          test "$(hostname)" = "$LOCALSINGLENODE_HOST"
          test "$(uname -s)" = Linux
          case "$(uname -r)" in *[Mm]icrosoft*) exit 1 ;; esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify validated main source for registry retention
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPACITY_RECOVERY_CI_RUN_ID: ${{ inputs.capacity_recovery_ci_run_id }}
          CAPACITY_RECOVERY_CI_ATTEMPT: ${{ inputs.capacity_recovery_ci_attempt }}
          RESERVATION_RUN_ID: ${{ inputs.registry_reservation_run_id }}
          RESERVATION_ATTEMPT: ${{ inputs.registry_reservation_attempt }}
          REGISTRY_RETENTION_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_registry == true }}
          PRIOR_CAPACITY_CI_RUN_ID: ${{ inputs.prior_capacity_ci_run_id }}
          PRIOR_CAPACITY_CI_ATTEMPT: ${{ inputs.prior_capacity_ci_attempt }}
        run: |
          set -euo pipefail
          if [[ -n "$RESERVATION_RUN_ID" || -n "$RESERVATION_ATTEMPT" ]]; then
            [[ "$RESERVATION_RUN_ID" =~ ^[1-9][0-9]*$ && "$RESERVATION_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$REGISTRY_RETENTION_APPLY" == true ]]
            [[ "$CAPACITY_RECOVERY_CI_RUN_ID" =~ ^[1-9][0-9]*$ && "$CAPACITY_RECOVERY_CI_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          fi
          if [[ -n "$CAPACITY_RECOVERY_CI_RUN_ID" || -n "$CAPACITY_RECOVERY_CI_ATTEMPT" ]]; then
            [[ "$CAPACITY_RECOVERY_CI_RUN_ID" =~ ^[1-9][0-9]*$ && "$CAPACITY_RECOVERY_CI_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            capacity_args=(--run-id "$CAPACITY_RECOVERY_CI_RUN_ID" --attempt "$CAPACITY_RECOVERY_CI_ATTEMPT")
            if [[ -n "$PRIOR_CAPACITY_CI_RUN_ID" || -n "$PRIOR_CAPACITY_CI_ATTEMPT" ]]; then
              [[ "$PRIOR_CAPACITY_CI_RUN_ID" =~ ^[1-9][0-9]*$ && "$PRIOR_CAPACITY_CI_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              [[ "$RESERVATION_RUN_ID" =~ ^[1-9][0-9]*$ && "$RESERVATION_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              capacity_args+=(--prior-capacity-run-id "$PRIOR_CAPACITY_CI_RUN_ID"
                --prior-capacity-attempt "$PRIOR_CAPACITY_CI_ATTEMPT"
                --reservation-run-id "$RESERVATION_RUN_ID" --reservation-attempt "$RESERVATION_ATTEMPT")
            fi
            python3 Deployment/Common/Scripts/verify-registry-capacity-recovery.py "${capacity_args[@]}"
          else
            python3 Deployment/Common/Scripts/verify-operation-source.py > /dev/null
          fi

      - name: Resolve configured payload packages
        id: packages
        run: |
          set -euo pipefail
          python3 Scripts/Frontend/resolve_frontend_profile.py >/dev/null
          printf 'primary=%s\n' "$(bash Deployment/Common/Scripts/read-release-setting.sh release_payload_image)" >> "$GITHUB_OUTPUT"

      - name: Prune bounded GHCR payload roots under the shared deployment lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCALCLUSTER_DEPLOY_LOCK_TIMEOUT_SECONDS: "300"
          REGISTRY_COORDINATION_SCOPE_COMPLETE: "true"
          REGISTRY_PROTECTION_PRIMARY_GZIP_B64: ${{ needs.localsinglenode_primary.outputs.protection_gzip_b64 }}
          REGISTRY_RETENTION_APPLY: ${{ github.event_name == 'schedule' || inputs.apply_registry == true }}
          RESERVATION_RUN_ID: ${{ inputs.registry_reservation_run_id }}
          RESERVATION_ATTEMPT: ${{ inputs.registry_reservation_attempt }}
        run: |
          set -euo pipefail
          apply=()
          if [[ "$REGISTRY_RETENTION_APPLY" == "true" ]]; then apply+=(--apply); fi
          packages=(--package "${{ steps.packages.outputs.primary }}=private")
          retained_bootstraps=(--retain-manifest "${{ steps.packages.outputs.primary }}@sha256:25fef0757d76c56cd980dca6cde1e156ab7a2daa902306ab48da4e12a6e7343f")
          decode_protection() {
            local encoded="$1"
            if (( ${#encoded} == 0 || ${#encoded} > 8192 )) || \
              [[ ! "$encoded" =~ ^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$ ]]; then
              echo "A cross-job release protection snapshot is missing or malformed." >&2
              return 1
            fi
            printf '%s' "$encoded" | base64 --decode | gzip --decompress
          }
          protection="$(decode_protection "$REGISTRY_PROTECTION_PRIMARY_GZIP_B64")"
          protections=(--protection-json "$protection")
          if [[ -n "$RESERVATION_RUN_ID" || -n "$RESERVATION_ATTEMPT" ]]; then
            [[ "$RESERVATION_RUN_ID" =~ ^[1-9][0-9]*$ && "$RESERVATION_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$REGISTRY_RETENTION_APPLY" == true ]]
            reservation_id="run-${RESERVATION_RUN_ID}-${RESERVATION_ATTEMPT}"
            lock_dir="${LOCALCLUSTER_DEPLOY_LOCK_DIR:-/tmp/localcluster-deploy.lockdir}"
            recovery_record="$RUNNER_TEMP/registry-retention-recovery.json"
            lock_token="$(python3 Deployment/Common/Scripts/registry-retention-recovery.py prepare \
              --owner-run-id "$RESERVATION_RUN_ID" --owner-attempt "$RESERVATION_ATTEMPT" \
              --record "$recovery_record" --print-lock-token)"
            export LOCALCLUSTER_DEPLOY_LOCK_DIR="$lock_dir" LOCALCLUSTER_DEPLOY_LOCK_TOKEN="$lock_token"
            retention_status=0
            python3 Deployment/Common/Scripts/registry-retention.py \
              "${packages[@]}" "${retained_bootstraps[@]}" "${protections[@]}" "${apply[@]}" \
              --reservation-id "$reservation_id" || retention_status=$?
            python3 Deployment/Common/Scripts/registry-retention-recovery.py release \
              --owner-run-id "$RESERVATION_RUN_ID" --owner-attempt "$RESERVATION_ATTEMPT" \
              --record "$recovery_record"
            exit "$retention_status"
          else
            bash Deployment/Common/Scripts/with-deploy-lock.sh \
              python3 Deployment/Common/Scripts/registry-retention.py \
                "${packages[@]}" "${retained_bootstraps[@]}" "${protections[@]}" "${apply[@]}"
          fi

      - name: Remove temporary registry recovery record
        if: always()
        run: rm -f -- "$RUNNER_TEMP/registry-retention-recovery.json"
